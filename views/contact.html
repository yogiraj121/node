<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Premium Laundry Service</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <nav>
        <div class="logo">LuxeWash</div>
        <ul>
            <li><a href="/home">Home</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/contact" class="active">Contact</a></li>
        </ul>
    </nav>
    <main>
        <section class="contact-section">
            <h1>Get in Touch</h1>
            <p>Ready for a fresher life? Contact us today.</p>
            <form action="#" id="contactForm">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="How can we help you?" rows="5" required></textarea>
                <button type="submit" class="btn">Send Message</button>
            </form>
            <div class="contact-info">
                <p><strong>Address:</strong> 123 Luxury Lane, Clean City</p>
                <p><strong>Phone:</strong> +1 (555) 000-CLEAN</p>
                <p><strong>Email:</strong> care@luxewash.com</p>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 LuxeWash Premium Laundry. All rights reserved.</p>
    </footer>
</body>

</html>
